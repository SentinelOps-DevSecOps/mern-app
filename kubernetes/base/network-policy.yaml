# ─────────────────────────────────────────────────────────────────
# Network Policies — Zero Trust Networking
# Default: deny ALL traffic
# Then explicitly allow only what's needed
# ─────────────────────────────────────────────────────────────────

# Rule 1: Deny everything by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: mern-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Rule 2: Frontend can receive from internet + send to backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: mern-prod
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}   # Allow from everywhere (public app)
  egress:
    # Can only talk to backend
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5000
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Rule 3: Backend only accepts from frontend + can reach MongoDB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend
  namespace: mern-prod
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 5000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mongodb
      ports:
        - port: 27017
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS outbound (for external API calls if needed)
    - ports:
        - port: 443
          protocol: TCP
---
# Rule 4: MongoDB only accepts from backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb
  namespace: mern-prod
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 27017

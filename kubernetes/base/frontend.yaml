# ─────────────────────────────────────────────────────────────────
# Frontend React/Nginx Deployment + LoadBalancer Service
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mern-prod
  labels:
    app: frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    101   # nginx user

      containers:
        - name: frontend
          # IMAGE TAG UPDATED AUTOMATICALLY BY JENKINS PIPELINE
          image: :latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              memory: "64Mi"
              cpu:    "50m"
            limits:
              memory: "128Mi"
              cpu:    "200m"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds:       20

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds:       10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: mern-prod
  labels:
    app: frontend
  annotations:
    # Creates AWS Network Load Balancer automatically
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: frontend
  ports:
    - port:       80
      targetPort: 80
      name:       http
  type: LoadBalancer

# ─────────────────────────────────────────────────────────────────
# MongoDB StatefulSet + Service
# StatefulSet gives stable network identity + persistent storage
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: mern-prod
  labels:
    app: mongodb
    tier: database
spec:
  serviceName: mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        tier: database
    spec:
      securityContext:
        runAsUser:  999
        runAsGroup: 999
        fsGroup:    999

      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
              name: mongodb

          env:
            - name: MONGO_INITDB_DATABASE
              value: "merndb"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb-password

          resources:
            requests:
              memory: "256Mi"
              cpu:    "250m"
            limits:
              memory: "512Mi"
              cpu:    "500m"

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

          livenessProbe:
            exec:
              command:
                - mongosh
                - "--eval"
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds:        20
            timeoutSeconds:       10
            failureThreshold:      3

          readinessProbe:
            exec:
              command:
                - mongosh
                - "--eval"
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds:       10

  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes:      ["ReadWriteOnce"]
        storageClassName: gp2
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: mern-prod
  labels:
    app: mongodb
spec:
  selector:
    app: mongodb
  clusterIP: None   # Headless — direct pod DNS resolution
  ports:
    - port:       27017
      targetPort: 27017
      name:       mongodb

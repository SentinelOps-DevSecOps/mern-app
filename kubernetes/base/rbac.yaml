# ─────────────────────────────────────────────────────────────────
# RBAC — Least Privilege Access Control
# ─────────────────────────────────────────────────────────────────

# Backend ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: mern-prod
  labels:
    app: backend
automountServiceAccountToken: false
---
# Frontend ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: mern-prod
  labels:
    app: frontend
automountServiceAccountToken: false
---
# Backend Role — minimal permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role
  namespace: mern-prod
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs:     ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mongodb-secret"]
    verbs: ["get"]
---
# Bind Role to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-role-binding
  namespace: mern-prod
subjects:
  - kind:      ServiceAccount
    name:      backend-sa
    namespace: mern-prod
roleRef:
  kind:     Role
  apiGroup: rbac.authorization.k8s.io
  name:     backend-role

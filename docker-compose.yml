# ─────────────────────────────────────────────────────────────
# Docker Compose — Local Development & Testing
# Runs all 3 services: MongoDB + Backend + Frontend
# Usage: docker compose up --build
# ─────────────────────────────────────────────────────────────

services:

  # ── MongoDB Database ──────────────────────────────────────
  mongodb:
    image: mongo:7.0          # Official MongoDB image
    container_name: mongodb
    restart: unless-stopped   # Restart if crashes, not if manually stopped
    environment:
      MONGO_INITDB_DATABASE: merndb
    volumes:
      # Named volume: data persists even if container is deleted
      - mongodb_data:/data/db
    networks:
      - mern-network
    ports:
      - "27017:27017"         # For local MongoDB Compass access
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Node.js Backend ───────────────────────────────────────
  backend:
    build:
      context: ./server        # Build from server/Dockerfile
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # process.env.MONGO_URL used in getConnection.js
      MONGO_URL: mongodb://mongodb:27017/merndb
      MONGO_URI: mongodb://mongodb:27017/merndb
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy  # Wait until MongoDB passes health check
    networks:
      - mern-network

  # ── React Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./client       # Build from client/Dockerfile
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"             # Browser: localhost:3000 → Nginx port 80
    depends_on:
      - backend
    networks:
      - mern-network

# ── Volumes & Networks ────────────────────────────────────────
volumes:
  mongodb_data:               # Persistent storage for MongoDB

networks:
  mern-network:
    driver: bridge            # Default Docker networking

